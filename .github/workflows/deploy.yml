name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Allow one concurrent deployment, cancelling any in-progress run for the same ref.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # NOTE: the built-in `cache: yarn` is intentionally NOT used. It
          # resolves the cache path by invoking the runner's global Yarn 1.x,
          # which fails because package.json pins Yarn 4 via "packageManager"
          # and Corepack isn't enabled yet at that point. Caching is handled
          # explicitly below, after Corepack is enabled.

      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        uses: actions/cache@v6
        with:
          # Yarn 4 with nodeLinker: node-modules uses the global zip cache.
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate static site
        run: yarn generate

      - name: Deploy to easylist-thailand.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Private half of a deploy key that has write access to
          # easylist-thailand/easylist-thailand.github.io.
          # (The action pushes over SSH whenever deploy_key is set.)
          deploy_key: ${{ secrets.GH_PAGES_DEPLOY_KEY }}
          external_repository: easylist-thailand/easylist-thailand.github.io
          publish_branch: master
          publish_dir: ./.output/public
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          # peaceiris excludes Jekyll and writes .nojekyll automatically
          # (enable_jekyll defaults to false).
